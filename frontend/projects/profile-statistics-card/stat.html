<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Statistics</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Sora:wght@100..800&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap Icon -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <!-- BOOTSTRAP CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <!-- MY CSS -->
    <link rel="stylesheet" href="/frontend/projects/profile-statistics-card/stat.css" />
  </head>
  <body>
    <main class="card">
      <!-- Hero Section -->
      <div class="hero">
        <img
          src="https://i.pinimg.com/736x/e5/65/ef/e565efd69d8c844c9fa0465d8a68f140.jpg"
          alt="cover image"
          class="image"
        />
        <i class="bi bi-person-plus-fill icon-overlay"></i>
      </div>
      <!-- Avatar -->
      <div class="avatar">
        <img
          src="https://i.pinimg.com/736x/22/61/d8/2261d8031b69470fb8e1e83e7f4eec60.jpg"
          alt="display picture"
        />
      </div>
      <!-- Info Section  -->
      <div class="info">
        <h1>Liam Hayes</h1>
        <p>
          Frame by Frame📸 Capturin' moments & cool spaces ✨New visual out
          now⬇️
        </p>
      </div>
      <!-- Stats Section -->
      <div class="stats">
        <div class="likes">
          <h2>72.9K</h2>
          <p>Likes</p>
        </div>
        <div class="posts">
          <h2>900</h2>
          <p>Posts</p>
        </div>
        <div class="views">
          <h2>342.5K</h2>
          <p>Views</p>
        </div>
      </div>
      <!-- Social Section -->
      <div class="social">
        <i class="bi bi-instagram"></i>
        <i class="bi bi-tiktok"></i>
        <i class="bi bi-snapchat"></i>
      </div>
    </main>
  </body>
</html>
